name: wigstore-blueprint

services:
  # Backend API Service
  - type: web
    name: wigstore-backend
    runtime: node
    rootDir: WigStore-Backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        value: https://minkaluxury.com
      - key: MONGODB_URI
        value: mongodb+srv://holuwaconquer488:mongodb@cluster0.ikmidho.mongodb.net/minka_luxury_hair?retryWrites=true&w=majority&appName=Cluster0
      - key: JWT_SECRET
        value: your_super_secret_jwt_key_change_this_in_production
      - key: JWT_EXPIRE
        value: 30d
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USER
        value: YOUR_EMAIL_HERE
      - key: EMAIL_PASS
        value: YOUR_EMAIL_PASSWORD_HERE
      - key: CLOUDINARY_CLOUD_NAME
        value: dimlar6iu
      - key: CLOUDINARY_API_KEY
        value: 294821539832255
      - key: CLOUDINARY_API_SECRET
        value: ZGKek9Xoze9lyNwozpZ3lN5tYXU
      - key: ADMIN_EMAIL
        value: admin@minka.com
      - key: ADMIN_PASSWORD
        value: admin123

  # Frontend Static Site
  - type: web
    name: wigstore-frontend
    runtime: static
    rootDir: mini-commerce
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: "/(.*)"
        destination: "/index.html"
    headers:
      - source: "/estarr.jpeg"
        headers:
          - key: Cache-Control
            value: "public, max-age=31536000, immutable"
      - source: "/assets/(.*)"
        headers:
          - key: Cache-Control
            value: "public, max-age=31536000, immutable"